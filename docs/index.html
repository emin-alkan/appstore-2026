<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App Store Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
/* App Store Atlas — technical/clean. Hairline grid, mono metadata, tabular numbers, spectrum map. Light + dark. */
:root{
  --bg:#ffffff; --panel:#fafafa; --panel-2:#f4f4f5; --ink:#09090b; --muted:#52525b; --faint:#a1a1aa;
  --line:#e7e7ea; --line-strong:#d6d6da;
  --accent:#059669; --accent-weak:#ecfdf5;
  --dead:#e2e2e6; --alive:#059669; --canvas:#ffffff; --pick:#c2820b; --pick-weak:#fef7e4;
  --good:#059669; --warn:#b45309; --bad:#c0392b;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b; --panel:#101013; --panel-2:#17171b; --ink:#fafafa; --muted:#a1a1aa; --faint:#5b5b63;
  --line:#242428; --line-strong:#34343a;
  --accent:#10b981; --accent-weak:#06281d;
  --dead:#3a3a41; --alive:#10b981; --canvas:#0c0c0f; --pick:#e0b24a; --pick-weak:#2a2310;
  --good:#10b981; --warn:#d99a3a; --bad:#e06a52;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090b; --panel:#101013; --panel-2:#17171b; --ink:#fafafa; --muted:#a1a1aa; --faint:#5b5b63;
  --line:#242428; --line-strong:#34343a;
  --accent:#10b981; --accent-weak:#06281d;
  --dead:#3a3a41; --alive:#10b981; --canvas:#0c0c0f; --pick:#e0b24a; --pick-weak:#2a2310;
  --good:#10b981; --warn:#d99a3a; --bad:#e06a52;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;}
img{max-width:100%;}
[hidden]{display:none!important;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";padding-bottom:env(safe-area-inset-bottom,0);}
a{color:var(--accent);}
.mono{font-family:var(--mono);}
.wrap{max-width:960px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));}

/* top bar */
.topbar{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21;}
.topbar .in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:11px;font-family:var(--mono);}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:13.5px;letter-spacing:-0.01em;}
.brand .sq{width:13px;height:13px;background:var(--accent);border-radius:2px;}
.nav{display:flex;align-items:center;gap:10px;}
.tabs{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;}
.tabs button{font-family:var(--mono);font-size:11.5px;letter-spacing:0.03em;text-transform:uppercase;padding:5px 12px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--faint);cursor:pointer;}
.tabs button:last-child{border-right:0;}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);}
.lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;}
.lang button{font-family:var(--mono);font-size:11px;font-weight:500;padding:5px 9px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--faint);cursor:pointer;}
.lang button:last-child{border-right:0;}
.lang button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);}

.view{padding-block:40px 30px;}

/* hero */
.kick{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin:0 0 15px;}
h1{font-weight:600;font-size:clamp(1.8rem,4.4vw,2.7rem);line-height:1.06;letter-spacing:-0.025em;margin:0;max-width:19ch;text-wrap:balance;}
.sub{color:var(--muted);font-size:1.01rem;margin:15px 0 0;max-width:64ch;} .sub b{color:var(--ink);font-weight:500;}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:32px;background:var(--panel);}
.stat{padding:15px 17px;border-right:1px solid var(--line);}
.stat:last-child{border-right:0;}
.stat .n{font-family:var(--mono);font-size:1.45rem;font-weight:500;letter-spacing:-0.02em;color:var(--ink);line-height:1.1;}
.stat .n.hl{color:var(--accent);}
.stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--faint);margin-top:7px;}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr);}.stat:nth-child(2){border-right:0;}.stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line);}}

/* map panel */
.panel{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:28px;background:var(--panel);}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint);flex-wrap:wrap;}
.phead .t{color:var(--muted);letter-spacing:0.02em;}
.phead .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.seg,.toggles{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;}
.seg button,.toggles button{font-family:var(--mono);font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;padding:4px 9px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--faint);cursor:pointer;}
.seg button:last-child,.toggles button:last-child{border-right:0;}
.seg button.on,.toggles button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);}
.canvas-box{position:relative;width:100%;aspect-ratio:1.5/1;background:var(--canvas);overflow:hidden;}
@media(max-width:620px){.canvas-box{aspect-ratio:1/1;}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.ovl{position:absolute;inset:0;pointer-events:none;}
.clab{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10.5px;color:var(--ink);opacity:0.62;white-space:nowrap;letter-spacing:0.01em;}
.pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--pick);color:var(--pick);background:var(--pick-weak);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:11px;pointer-events:auto;cursor:pointer;}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 9px;border-radius:6px;font-family:var(--mono);font-size:11px;max-width:230px;line-height:1.4;transform:translate(-50%,calc(-100% - 10px));box-shadow:0 4px 16px rgba(0,0,0,0.18);}
.tip b{display:block;font-weight:600;overflow-wrap:anywhere;margin-bottom:2px;}
.tip s{text-decoration:none;color:var(--faint);}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-family:var(--mono);font-size:12px;}
.phint{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;color:var(--faint);}
.legend{display:flex;align-items:center;gap:8px;}
.legend .bar{width:84px;height:8px;border-radius:2px;}

/* findings */
.findings{margin-top:42px;}
.findings h2{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);margin:0 0 4px;font-weight:500;}
.frow{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:17px 0;border-top:1px solid var(--line);align-items:start;}
.frow:first-of-type{border-top:0;}
.frow .k{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:0.01em;padding-top:2px;}
.frow .v{color:var(--ink);font-size:0.97rem;} .frow .v b{font-family:var(--mono);font-weight:500;color:var(--ink);} .frow .v .g{color:var(--muted);}
@media(max-width:560px){.frow{grid-template-columns:1fr;gap:5px;}}

/* finder */
.controls{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:9px;align-items:end;}
.ctl{display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-width:0;}
.ctl.wide{flex:1.35 1 0;min-width:0;}
@media(max-width:680px){.controls{flex-wrap:wrap;}.ctl,.ctl.wide{flex:1 1 100%;}}
.ctl label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--faint);}
.ctl input,.ctl select{font:inherit;font-size:0.9rem;background:var(--bg);border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;color:var(--ink);width:100%;}
.ctl input:focus,.ctl select:focus{outline:2px solid var(--accent-weak);border-color:var(--accent);}
.rr{display:flex;gap:6px;align-items:center;} .rr input{width:100%;} .rr span{color:var(--faint);}
.hint{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:10px;line-height:1.5;}
.status{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.2em;}
.status.err{color:var(--bad);}

.signal{margin-top:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);}
.signal-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line);}
.verdict{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:0.06em;padding:5px 11px;border-radius:5px;text-transform:uppercase;}
.verdict.good{color:var(--good);background:var(--accent-weak);}
.verdict.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);}
.verdict.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);}
.verdict.none,.verdict.thin{color:var(--faint);background:var(--panel-2);}
.signal-top .headline{font-size:0.96rem;color:var(--ink);}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:1px;background:var(--line);}
.metrics div{background:var(--panel);padding:12px 14px;}
.metrics .k{font-family:var(--mono);font-size:1.1rem;font-weight:500;letter-spacing:-0.02em;color:var(--ink);}
.metrics .l{font-family:var(--mono);font-size:10px;letter-spacing:0.03em;text-transform:uppercase;color:var(--faint);margin-top:3px;}

.section-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);margin:26px 0 10px;}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:9px;}
table{width:100%;border-collapse:collapse;font-size:0.86rem;min-width:560px;}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono);}
th{background:var(--panel-2);font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--faint);font-weight:500;cursor:default;position:sticky;top:0;}
td{color:var(--muted);}
td:first-child,th:first-child{text-align:left;white-space:normal;min-width:180px;font-family:var(--sans);}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover{background:var(--panel-2);}
td a{color:var(--ink);text-decoration:none;} td a:hover{color:var(--accent);text-decoration:underline;}
.words{display:flex;flex-wrap:wrap;gap:6px;}
.words span{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;padding:3px 9px;color:var(--muted);cursor:pointer;}
.words span:hover{border-color:var(--accent);color:var(--accent);}
.empty{padding:36px 20px;text-align:center;color:var(--faint);font-family:var(--sans);}

footer{margin-top:44px;border-top:1px solid var(--line);padding-block:20px 48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--faint);}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong);}
footer a:hover{color:var(--accent);border-color:var(--accent);}
.foot{margin-top:24px;font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.6;max-width:80ch;} .foot b{color:var(--muted);}
</style>
</head>
<body>
<header class="topbar"><div class="wrap in">
  <div class="brand"><span class="sq"></span>appstore-atlas</div>
  <div class="nav">
    <div class="tabs" role="tablist">
      <button id="tab-map" role="tab" aria-selected="true" data-i="tab_map">map</button>
      <button id="tab-finder" role="tab" aria-selected="false" data-i="tab_finder">finder</button>
    </div>
    <div class="lang">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-tr" aria-pressed="false">TR</button>
    </div>
  </div>
</div></header>

<!-- ============ MAP ============ -->
<main id="view-map" class="view wrap" role="tabpanel">
  <p class="kick" data-i="map_kick"></p>
  <h1 data-i="map_h1"></h1>
  <p class="sub" id="map_lede"></p>

  <div class="stats">
    <div class="stat"><div class="n">1,613,165</div><div class="l" data-i="st_apps"></div></div>
    <div class="stat"><div class="n">53.6%</div><div class="l" data-i="st_zero"></div></div>
    <div class="stat"><div class="n hl">7.2%</div><div class="l" data-i="st_used"></div></div>
    <div class="stat"><div class="n">50</div><div class="l" data-i="st_clusters"></div></div>
  </div>

  <div class="panel">
    <div class="phead">
      <span class="t" data-i="fig01"></span>
      <span class="right">
        <span class="seg" id="seg"><button data-m="spectrum" class="on">spectrum</button><button data-m="signal">signal</button></span>
        <span class="toggles"><button id="t-labels" aria-pressed="true" data-i="labels"></button><button id="t-pins" aria-pressed="true" data-i="pins"></button></span>
      </span>
    </div>
    <div class="canvas-box" id="box">
      <canvas id="cv"></canvas><div class="ovl" id="ovl"></div>
      <div class="loading" id="map-loading" data-i="loading"></div>
    </div>
    <div class="phint">
      <span class="legend" id="legend"></span>
      <span data-i="maphint"></span>
    </div>
  </div>

  <section class="findings">
    <h2 data-i="readout"></h2>
    <div class="frow"><div class="k">half_empty</div><div class="v" id="r1"></div></div>
    <div class="frow"><div class="k">no_void</div><div class="v" id="r2"></div></div>
    <div class="frow"><div class="k">tools&gt;games</div><div class="v" id="r3"></div></div>
    <div class="frow"><div class="k">ai_wave</div><div class="v" id="r4"></div></div>
  </section>
</main>

<!-- ============ FINDER ============ -->
<main id="view-finder" class="view wrap" role="tabpanel" hidden>
  <p class="kick" data-i="find_kick"></p>
  <h1 data-i="find_h1"></h1>
  <p class="sub" id="find_lede"></p>

  <div class="controls">
    <div class="ctl"><label data-i="f_category"></label><select id="f-cat"></select></div>
    <div class="ctl wide"><label data-i="f_keyword"></label><input id="f-kw" type="search" placeholder=""></div>
    <div class="ctl wide"><label data-i="f_reviews"></label><div class="rr"><input id="f-rmin" type="number" min="0" placeholder="min"><span>–</span><input id="f-rmax" type="number" min="0" placeholder="max"></div></div>
    <div class="ctl"><label data-i="f_minrating"></label><input id="f-rating" type="number" min="0" max="5" step="0.1" placeholder="0"></div>
    <div class="ctl"><label data-i="f_price"></label><select id="f-price"><option value="all" data-i="price_all"></option><option value="free" data-i="price_free"></option><option value="paid" data-i="price_paid"></option></select></div>
    <div class="ctl"><label data-i="f_year"></label><input id="f-year" type="number" min="2008" max="2026" placeholder="2008"></div>
    <div class="ctl"><label data-i="f_lang"></label><select id="f-tr"><option value="all" data-i="lang_all"></option><option value="tr" data-i="lang_tr"></option><option value="notr" data-i="lang_notr"></option></select></div>
  </div>
  <p class="hint" data-i="f_hint"></p>
  <div class="status" id="f-status"></div>

  <div id="f-results" hidden>
    <div class="signal">
      <div class="signal-top"><span class="verdict" id="sig-verdict"></span><span class="headline" id="sig-headline"></span></div>
      <div class="metrics" id="sig-metrics"></div>
    </div>
    <div class="section-h" data-i="s_competitors"></div>
    <div class="tscroll"><table id="comp-tbl"><thead></thead><tbody></tbody></table></div>
    <div class="section-h" data-i="s_subniches"></div>
    <div class="words" id="words"></div>
    <div class="section-h" id="results-h"></div>
    <div class="tscroll"><table id="res-tbl"><thead></thead><tbody></tbody></table></div>
  </div>

  <p class="foot" id="find_foot"></p>
</main>

<footer class="wrap">
  <span data-i="foot_left"></span>
  <span>built by <a href="https://github.com/emin-alkan">Emin Alkan</a> · <a href="https://x.com/miraisama_">@miraisama_</a></span>
</footer>

<script>
/* ===================== i18n ===================== */
const T = {
  en:{
    tab_map:"map", tab_finder:"finder",
    map_kick:"Semantic map · 1.6M apps",
    map_h1:"Every public app on the App Store, placed by meaning.",
    map_lede:"We scraped the full US storefront, embedded all <b>1,613,165</b> descriptions, and projected them to 2D. Nearby apps are similar in meaning; colour = how <b>alive</b> a region is. Then we looked for the empty corners — at this scale, there basically aren't any.",
    st_apps:"apps indexed", st_zero:"zero ratings", st_used:"&gt; 100 ratings", st_clusters:"clusters",
    fig01:"fig.01 — meaning-space projection · UMAP(2)",
    labels:"labels", pins:"pins", loading:"loading map…",
    graveyard:"graveyard", alive:"alive",
    maphint:"hover a point → app · shade = share past 100 ratings",
    readout:"Readout",
    r1:"<b>53.6%</b> of apps have zero ratings; only <b>7.2%</b> ever pass 100 — the line between a product and a placeholder. <span class='g'>Whole regions of the map sit pale and unused.</span>",
    r2:"The \"find the untouched gap\" trick works on 146k Steam games. <span class='g'>At 1.6M apps the surface is full — the signal is weak competition in a live area, not blank space.</span>",
    r3:"<b>80.8%</b> of apps updated in 2024+. Health, Finance and Productivity each grew ~50% vs the 2021 record; <span class='g'>Games, the largest category, barely moved.</span>",
    r4:"AI mentions concentrate: Notes <b>40%</b>, Voice <b>38%</b> — but Shopping and Food &amp; Drink under <b>3%</b>. <span class='g'>Narrower than the headlines suggest.</span>",
    find_kick:"Opportunity finder · in-browser",
    find_h1:"Find demand with weak competition.",
    find_lede:"Pick a category, then filter by keyword, reviews, rating, price and language to surface sub-niches with <b>demand but thin competition</b>. Everything runs in your browser — no server.",
    f_category:"category", f_keyword:"keyword", f_reviews:"reviews (min–max)", f_minrating:"min rating", f_price:"price", f_year:"year ≥", f_lang:"language",
    price_all:"all", price_free:"free", price_paid:"paid", lang_all:"any", lang_tr:"Turkish only", lang_notr:"no Turkish",
    f_hint:"tip: to find underserved niches, set a low max on reviews (e.g. 0–50) — that surfaces the thin, weak-competition corners.",
    choose_cat:"select a category to load its data.",
    loading_cat:"loading {cat} ({mb} MB)…", querying:"searching…",
    s_competitors:"top competitors", s_subniches:"sub-niche words (click to search)",
    results_h:"results ({n} matches, showing {shown})",
    th_app:"app", th_reviews:"reviews", th_rating:"rating", th_price:"price", th_year:"year", th_tr:"tr",
    no_match:"No apps match these filters.",
    v_dead:"dead", v_weak:"weak demand", v_crowded:"crowded", v_promising:"promising", v_thin:"thin data",
    m_matches:"matches", m_traction:"with ≥100 reviews", m_leader:"leader reviews", m_tr:"Turkish support", m_medrev:"median reviews",
    h_dead:"No app here has real traction — likely no demand.",
    h_weak:"Only a handful get used — demand looks weak.",
    h_crowded:"Big and dominated — hard to break in.",
    h_promising:"Some apps get used, but the field is thin — worth a closer look.",
    h_thin:"Too few apps to read a signal.",
    note_conc:"Top 3 apps hold {pct}% of all reviews — one or two giants dominate.",
    note_tr:"Only {pct}% support Turkish — a localization gap.",
    foot_left:"appstore-atlas · MIT / CC-BY · not affiliated with Apple",
    find_foot:"How the signal works. DEAD: no app ≥100 reviews. WEAK: 1–2 apps ≥100. CROWDED: 50+ apps and (leader >100k reviews or >3000 competitors). Otherwise PROMISING. Notes added when the top 3 hold >80% of reviews, or Turkish support is under 10%. Reviews and prices are US-storefront only — real local demand isn't in this data. Keyword search covers the app name + first 100 characters of the description. The signal is a first read; validate promising niches properly before building."
  },

let LANG = (()=>{ try{return localStorage.getItem('atlas-lang')||'en';}catch(e){return 'en';} })();

function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{ el.innerHTML=t(el.getAttribute('data-i')); });
  ['map_lede','find_lede','find_foot'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML=t(id);});
  ['r1','r2','r3','r4'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML=t(id);});

  document.getElementById('lang-tr').setAttribute('aria-pressed',LANG==='tr');
  setLegend();
  if(window._mapReady){ layout(); }
  if(window._lastResult){ renderResult(window._lastResult); }
  const st=document.getElementById('f-status'); if(st && !CAT_LOADED) st.textContent=t('choose_cat');
}
function setLang(l){ LANG=l; try{localStorage.setItem('atlas-lang',l);}catch(e){} applyLang(); }

const CAND=[
  {n:1,cx:3.28,cy:-2.24,title:{en:"Localized financial calculators",tr:"Yerel finans hesaplayıcıları"}},
  {n:2,cx:0.01,cy:3.54,title:{en:"AI journal / thought partner",tr:"AI günlük / düşünce ortağı"}},
  {n:3,cx:-1.87,cy:1.88,title:{en:"Reverse image search",tr:"Ters görsel arama"}},
  {n:4,cx:-0.09,cy:5.24,title:{en:"Voice language-learning games",tr:"Sesli dil öğrenme oyunları"}},
  {n:5,cx:-1.32,cy:-0.16,title:{en:"Regional field guides",tr:"Bölgesel saha rehberleri"}}
];
const LANDMARKS=[10,40,3,32,34,16,21,49,41,28,26,4,11,23,15,0,8,35,29,20,31,14,27,2,38,18,7,9,43,42,1,36,48,17,39,19];
let PTS=[],CL=[],clById={},proj=null,grid=null,dpr=Math.min(2,window.devicePixelRatio||1),showLabels=true,showPins=true,tip=null;
const XMIN=-9.12,XMAX=6.21,YMIN=-8.86,YMAX=7.99;
const box=document.getElementById('box'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ovl=document.getElementById('ovl');
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const hx=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,t)=>`rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
function ramp(stops,t){const n=stops.length-1,x=Math.max(0,Math.min(1,t))*n,i=Math.min(n-1,Math.floor(x));return mix(stops[i],stops[i+1],x-i);}
let MODE='spectrum',CDEAD,CALIVE;
const SPEC=['#e2603a','#e6a23c','#9cb04a','#3ba06c'].map(hx);
const SPEC_CSS='#e2603a,#e6a23c,#9cb04a,#3ba06c';
function readColors(){CDEAD=hx(css('--dead'));CALIVE=hx(css('--alive'));}
function tc(v){const k=Math.max(0,Math.min(1,v/18));
  if(MODE==='spectrum')return ramp(SPEC,Math.pow(k,0.9));
  return mix(CDEAD,CALIVE,Math.pow(k,1.5));}
function setLegend(){const L=document.getElementById('legend');if(!L)return;
  const g=MODE==='spectrum'?SPEC_CSS:'var(--dead),var(--alive)';
  L.innerHTML=`${t('graveyard')}<span class="bar" style="background:linear-gradient(90deg,${g})"></span>${t('alive')}`;}
function setProj(){const W=box.clientWidth,H=box.clientHeight,pad=24;proj={W,H,pad,sx:x=>(x-XMIN)/(XMAX-XMIN)*(W-2*pad)+pad,sy:y=>H-((y-YMIN)/(YMAX-YMIN)*(H-2*pad)+pad)};}
function resize(){const W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);setProj();buildGrid();readColors();draw();setLegend();layout();}
function buildGrid(){grid={cell:10,map:new Map()};for(let i=0;i<PTS.length;i++){const p=PTS[i],gx=Math.floor(proj.sx(p[0])/10),gy=Math.floor(proj.sy(p[1])/10),k=gx+','+gy;let a=grid.map.get(k);if(!a){a=[];grid.map.set(k,a);}a.push(i);}}
function draw(){const{W,H}=proj;ctx.clearRect(0,0,W,H);ctx.globalAlpha=0.82;for(let i=0;i<PTS.length;i++){const p=PTS[i],c=clById[p[2]];ctx.fillStyle=tc(c?c.tract:5);ctx.beginPath();ctx.arc(proj.sx(p[0]),proj.sy(p[1]),1.6,0,6.283);ctx.fill();}ctx.globalAlpha=1;}
function layout(){ovl.innerHTML='';if(showLabels){LANDMARKS.forEach(id=>{const c=clById[id];if(!c)return;const d=document.createElement('div');d.className='clab';d.style.left=proj.sx(c.cx)+'px';d.style.top=proj.sy(c.cy)+'px';d.textContent=c.label.split(' · ')[0].toLowerCase();ovl.appendChild(d);});}
  if(showPins){CAND.forEach(r=>{const d=document.createElement('div');d.className='pin';d.style.left=proj.sx(r.cx)+'px';d.style.top=proj.sy(r.cy)+'px';d.textContent=r.n;d.title=r.title[LANG]||r.title.en;ovl.appendChild(d);});}}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function showTip(sx,sy){if(!grid)return;const gx=Math.floor(sx/10),gy=Math.floor(sy/10);let best=-1,bd=1e9;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const arr=grid.map.get((gx+a)+','+(gy+b));if(!arr)continue;for(const i of arr){const p=PTS[i],dx=proj.sx(p[0])-sx,dy=proj.sy(p[1])-sy,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=i;}}}if(best<0||bd>120){if(tip){tip.remove();tip=null;}return;}const p=PTS[best],c=clById[p[2]];if(!tip){tip=document.createElement('div');tip.className='tip';box.appendChild(tip);}tip.style.left=proj.sx(p[0])+'px';tip.style.top=proj.sy(p[1])+'px';tip.innerHTML=`<b>${esc(p[3]||'—')}</b><s>${c?esc(c.label.split(' · ')[0]):''} · ${p[4]} ${LANG==='tr'?'yorum':'ratings'}</s>`;}
document.getElementById('t-labels').onclick=e=>{showLabels=!showLabels;e.target.setAttribute('aria-pressed',showLabels);layout();};
document.getElementById('t-pins').onclick=e=>{showPins=!showPins;e.target.setAttribute('aria-pressed',showPins);layout();};
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;MODE=b.dataset.m;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));readColors();draw();setLegend();});
box.addEventListener('pointermove',e=>{const r=box.getBoundingClientRect();showTip(e.clientX-r.left,e.clientY-r.top);});
box.addEventListener('pointerleave',()=>{if(tip){tip.remove();tip=null;}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readColors();draw();setLegend();});
Promise.all([fetch('points.json').then(r=>r.json()),fetch('meta.json').then(r=>r.json())]).then(([pts,meta])=>{
  PTS=pts;CL=meta.clusters;CL.forEach(c=>clById[c.id]=c);const l=document.getElementById('map-loading');if(l)l.remove();window._mapReady=true;resize();
  let to;window.addEventListener('resize',()=>{clearTimeout(to);to=setTimeout(resize,150);});
}).catch(e=>{const l=document.getElementById('map-loading');if(l)l.textContent='failed to load map data';});

/* ===================== FINDER (DuckDB-WASM) ===================== */
let DB=null,CONN=null,CAT_LOADED=null,INDEX=null,duckdbMod=null,LOADSEQ=0;
const $=id=>document.getElementById(id);
async function initDuck(){
  if(DB) return;
  duckdbMod = await import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm');
  const bundles = duckdbMod.getJsDelivrBundles();
  const bundle = await duckdbMod.selectBundle(bundles);
  const wurl = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`],{type:'text/javascript'}));
  const worker = new Worker(wurl);
  DB = new duckdbMod.AsyncDuckDB(new duckdbMod.ConsoleLogger(), worker);
  await DB.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(wurl);
  CONN = await DB.connect();
}
async function loadCategory(file,label,mb){
  const myseq=++LOADSEQ;                       // race guard: newest selection wins
  await initDuck();
  setStatus(t('loading_cat').replace('{cat}',label).replace('{mb}',mb));
  const rel = file.includes('/') ? file : 'data/cat/'+file;   // no double-prefix
  const buf = new Uint8Array(await (await fetch(rel)).arrayBuffer());
  if(myseq!==LOADSEQ) return false;            // superseded while fetching
  try{ await DB.dropFile('cat.parquet'); }catch(e){}
  await DB.registerFileBuffer('cat.parquet', buf);
  if(myseq!==LOADSEQ) return false;            // superseded while registering
  CAT_LOADED=file;
  return true;
}
function esql(s){return "'"+String(s).replace(/'/g,"''")+"'";}
function buildWhere(){
  const w=["1=1"];
  const kw=$('f-kw').value.trim().toLowerCase();
  if(kw){ kw.split(/\s+/).forEach(word=>{ if(word) w.push("s LIKE "+esql('%'+word+'%')); }); }
  const rmin=$('f-rmin').value, rmax=$('f-rmax').value, rt=$('f-rating').value, yr=$('f-year').value;
  if(rmin!=='') w.push("reviews >= "+(+rmin));
  if(rmax!=='') w.push("reviews <= "+(+rmax));
  if(rt!=='') w.push("rating >= "+(+rt));
  if(yr!=='') w.push("year >= "+(+yr));
  const pr=$('f-price').value; if(pr==='free') w.push("price = 0"); else if(pr==='paid') w.push("price > 0");
  const tr=$('f-tr').value; if(tr==='tr') w.push("tr = 1"); else if(tr==='notr') w.push("tr = 0");
  return w.join(" AND ");
}
async function q(sql){ const r=await CONN.query(sql); return r.toArray().map(row=>row.toJSON()); }
function setStatus(msg,err){const s=$('f-status');s.textContent=msg||'';s.classList.toggle('err',!!err);}

async function runSearch(){
  if(!CAT_LOADED){ setStatus(t('choose_cat')); return; }
  setStatus(t('querying'));
  const where=buildWhere();
  try{
    const agg=(await q(`SELECT count(*)::BIGINT n, sum(CASE WHEN reviews>=100 THEN 1 ELSE 0 END)::BIGINT tr100, max(reviews)::BIGINT maxr, sum(reviews)::BIGINT totrev, sum(CASE WHEN tr=1 THEN 1 ELSE 0 END)::BIGINT trc, median(CASE WHEN reviews>0 THEN reviews END) medrev FROM 'cat.parquet' WHERE ${where}`))[0];
    const comp=await q(`SELECT id,name,reviews,rating,price,year,tr FROM 'cat.parquet' WHERE ${where} ORDER BY reviews DESC LIMIT 15`);
    const top3=await q(`SELECT sum(reviews)::BIGINT s FROM (SELECT reviews FROM 'cat.parquet' WHERE ${where} ORDER BY reviews DESC LIMIT 3)`);
    const rows=await q(`SELECT id,name,reviews,rating,price,year,tr FROM 'cat.parquet' WHERE ${where} ORDER BY reviews DESC LIMIT 500`);
    const words=await q(`SELECT word, count(*)::BIGINT c FROM (SELECT unnest(string_split_regex(lower(name),'[^a-z0-9ğüşıöç]+')) word FROM 'cat.parquet' WHERE ${where}) WHERE length(word)>=3 GROUP BY word ORDER BY c DESC LIMIT 60`);
    const res={agg:num(agg),comp,rows,words,top3:num(top3[0]).s||0};
    window._lastResult=res; renderResult(res);
    setStatus('');
  }catch(err){ setStatus('DuckDB error: '+err, true); console.error(err); }
}
function num(o){const r={};for(const k in o){const v=o[k];r[k]=(typeof v==='bigint')?Number(v):v;}return r;}

function verdict(a,top3){
  const n=a.n|0, tr100=a.tr100|0, maxr=a.maxr|0;
  if(n<8) return['thin','v_thin','h_thin'];
  if(tr100===0) return['bad','v_dead','h_dead'];
  if(tr100<=2) return['bad','v_weak','h_weak'];
  if(n>=50 && (maxr>100000 || n>3000)) return['warn','v_crowded','h_crowded'];
  return['good','v_promising','h_promising'];
}
function renderResult(res){
  $('f-results').hidden=false;
  const a=res.agg, [vc,vk,hk]=verdict(a,res.top3);
  const V=$('sig-verdict'); V.className='verdict '+vc; V.textContent=t(vk);
  const notes=[];
  const totrev=a.totrev||0;
  if(totrev>0 && res.top3/totrev>0.8 && (a.n|0)>5) notes.push(t('note_conc').replace('{pct}',Math.round(res.top3/totrev*100)));
  const trpct=a.n? Math.round((a.trc||0)/a.n*100):0;
  if((a.n|0)>=20 && trpct<10) notes.push(t('note_tr').replace('{pct}',trpct));
  $('sig-headline').textContent = t(hk)+(notes.length?' '+notes.join(' '):'');
  const M=$('sig-metrics');
  M.innerHTML=[
    [fmt(a.n), t('m_matches')],
    [fmt(a.tr100||0), t('m_traction')],
    [fmt(a.maxr||0), t('m_leader')],
    [(a.medrev!=null?fmt(Math.round(a.medrev)):'0'), t('m_medrev')],
    ['%'+trpct, t('m_tr')]
  ].map(m=>`<div><div class="k">${m[0]}</div><div class="l">${m[1]}</div></div>`).join('');
  const head=`<tr><th>${t('th_app')}</th><th>${t('th_reviews')}</th><th>${t('th_rating')}</th><th>${t('th_price')}</th><th>${t('th_year')}</th><th>${t('th_tr')}</th></tr>`;
  const rowHtml=r=>`<tr><td><a href="https://apps.apple.com/app/id${r.id}" target="_blank" rel="noopener">${esc(r.name||'')}</a></td><td>${fmt(r.reviews||0)}</td><td>${r.rating?(+r.rating).toFixed(2):'–'}</td><td>${r.price>0?'$'+(+r.price).toFixed(2):(LANG==='tr'?'Ücretsiz':'Free')}</td><td>${r.year||'–'}</td><td>${r.tr?'✓':''}</td></tr>`;
  $('comp-tbl').querySelector('thead').innerHTML=head;
  $('comp-tbl').querySelector('tbody').innerHTML=res.comp.map(num).map(rowHtml).join('')||`<tr><td colspan="6" class="empty">${t('no_match')}</td></tr>`;
  $('results-h').textContent=t('results_h').replace('{n}',fmt(a.n)).replace('{shown}',Math.min(a.n,500));
  $('res-tbl').querySelector('thead').innerHTML=head;
  $('res-tbl').querySelector('tbody').innerHTML=res.rows.map(num).map(rowHtml).join('')||`<tr><td colspan="6" class="empty">${t('no_match')}</td></tr>`;
  const W=$('words'); W.innerHTML=res.words.map(num).map(w=>`<span data-w="${esc(w.word)}">${esc(w.word)} ${w.c}</span>`).join('');
  W.querySelectorAll('span').forEach(s=>s.onclick=()=>{$('f-kw').value=s.getAttribute('data-w');runSearch();});
}
function fmt(n){return (n||0).toLocaleString(LANG==='tr'?'tr-TR':'en-US');}

['f-kw','f-rmin','f-rmax','f-rating','f-price','f-year','f-tr'].forEach(id=>{
  const el=$(id); const ev=el.tagName==='SELECT'?'change':'input';
  let to; el.addEventListener(ev,()=>{clearTimeout(to);to=setTimeout(runSearch,250);});
});
$('f-cat').addEventListener('change',async e=>{
  const opt=e.target.selectedOptions[0]; if(!opt||!opt.value){return;}
  try{ const ok=await loadCategory(opt.value, opt.dataset.label, opt.dataset.mb); if(ok) await runSearch(); }
  catch(err){ setStatus('Load error: '+err,true); console.error(err); }
});
fetch('index.json').then(r=>r.json()).then(idx=>{
  INDEX=idx; const sel=$('f-cat');
  sel.innerHTML=`<option value="">— ${LANG==='tr'?'kategori seç':'select category'} —</option>`;
  (idx.categories||idx).slice().sort((a,b)=>b.count-a.count).forEach(c=>{
    const o=document.createElement('option'); o.value=c.file; o.dataset.label=c.genre; o.dataset.mb=((c.bytes||0)/1048576).toFixed(1);
    o.textContent=`${c.genre} (${(c.count||0).toLocaleString()})`; sel.appendChild(o);
  });
  setStatus(t('choose_cat'));
}).catch(e=>setStatus('index.json not found — place data files in the same folder.',true));

applyLang();
</script>
